[package]
name = "cargo-warm"
version = "0.3.1"
edition = "2024"
rust-version = "1.98.0"
description = "Make new Rust worktrees start warm by safely forking Cargo build state"
license = "Apache-2.0"
repository = "https://github.com/amxv/cargo-warm"
homepage = "https://cargowarm.ashray.xyz"
readme = "README.md"
publish = true
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]
keywords = ["cargo", "worktree", "build-cache", "rust", "developer-tools"]
categories = ["command-line-utilities"]

[package.metadata.dist]
dist = true

[[bin]]
name = "cargo-warm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
reflink-copy = "0.1.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Fast local development defaults; use `--profile debugging` when full debug
# information is actually needed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dist]
inherits = "release"
